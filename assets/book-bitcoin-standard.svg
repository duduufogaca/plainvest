<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 630" role="img" aria-labelledby="title desc">
  <title id="title">The Bitcoin Standard book cover placeholder</title>
  <desc id="desc">A launch-safe stylized cover for The Bitcoin Standard when external cover services fail.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4b53f"/>
      <stop offset=".48" stop-color="#f7931a"/>
      <stop offset="1" stop-color="#8f4b08"/>
    </linearGradient>
    <radialGradient id="glow" cx=".24" cy=".18" r=".7">
      <stop offset="0" stop-color="#fff5cc" stop-opacity=".8"/>
      <stop offset=".5" stop-color="#ffe08a" stop-opacity=".18"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="420" height="630" rx="16" fill="#0a1324"/>
  <rect x="18" y="18" width="384" height="594" rx="12" fill="url(#bg)"/>
  <rect x="34" y="34" width="352" height="562" rx="10" fill="url(#glow)"/>
  <circle cx="210" cy="255" r="96" fill="#0b1628" opacity=".93"/>
  <text x="210" y="292" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="118" font-weight="900" fill="#ffffff">₿</text>
  <text x="210" y="90" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="35" font-weight="700" fill="#111827">THE</text>
  <text x="210" y="146" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="700" fill="#111827">BITCOIN</text>
  <text x="210" y="198" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="700" fill="#111827">STANDARD</text>
  <line x1="82" y1="388" x2="338" y2="388" stroke="#111827" stroke-width="3" opacity=".62"/>
  <text x="210" y="430" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800" letter-spacing="2" fill="#111827">THE DECENTRALIZED</text>
  <text x="210" y="460" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800" letter-spacing="2" fill="#111827">ALTERNATIVE TO</text>
  <text x="210" y="490" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800" letter-spacing="2" fill="#111827">CENTRAL BANKING</text>
  <text x="210" y="558" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="900" fill="#111827">SAIFEDEAN AMMOUS</text>
</svg>
